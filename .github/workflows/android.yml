name: Android CI

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Restore release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p .local
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .local/txtoi-release.keystore
          cat > signing.properties <<EOF
          storeFile=.local/txtoi-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build and lint
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew :app:assembleRelease :app:lintRelease :app:verifyModernXposedMetadata --no-daemon
          else
            ./gradlew :app:assembleDebug :app:lintDebug :app:verifyModernXposedMetadata --no-daemon
          fi
      - name: Name release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/txtoi-${{ github.ref_name }}.apk
      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: txtoi-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/txtoi-${{ github.ref_name }}.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/txtoi-${{ github.ref_name }}.apk
          body: |
            ## 改进

            - 更新检查改用 Release 页面并增加本地缓存，减少重复请求失败。
            - 关于页面新增自动检测更新开关。
      - name: Prepare LSPosed mirror release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/release/output-metadata.json
          version_code=$(jq -er '.elements[0].versionCode' "$metadata")
          version_name=$(jq -er '.elements[0].versionName' "$metadata")
          test "$version_code" -gt 0
          test -n "$version_name"
          echo "LSPOSED_TAG=$version_code-$version_name" >> "$GITHUB_ENV"
          echo "LSPOSED_VERSION=$version_name" >> "$GITHUB_ENV"
          echo "LSPOSED_ASSET=app/build/outputs/apk/release/txtoi-${GITHUB_REF_NAME}.apk" >> "$GITHUB_ENV"
      - name: Sync release to LSPosed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          MIRROR_REPOSITORY: Xposed-Modules-Repo/io.github.selectionmenucontrol
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?XPOSED_REPO_TOKEN is required for LSPosed release sync}"
          release_notes="$RUNNER_TEMP/lsposed-release-notes.md"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$release_notes"
          if gh release view "$LSPOSED_TAG" --repo "$MIRROR_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$LSPOSED_TAG" --repo "$MIRROR_REPOSITORY" --title "$LSPOSED_VERSION" --notes-file "$release_notes"
            gh release upload "$LSPOSED_TAG" "$LSPOSED_ASSET" --repo "$MIRROR_REPOSITORY" --clobber
          else
            gh release create "$LSPOSED_TAG" "$LSPOSED_ASSET" --repo "$MIRROR_REPOSITORY" --title "$LSPOSED_VERSION" --notes-file "$release_notes"
          fi
          asset_name=$(basename "$LSPOSED_ASSET")
          expected_digest="sha256:$(sha256sum "$LSPOSED_ASSET" | awk '{print $1}')"
          mirror_digest=$(gh release view "$LSPOSED_TAG" --repo "$MIRROR_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$asset_name\") | .digest")
          test "$mirror_digest" = "$expected_digest"
