name: Android CI

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      apk_name: ${{ steps.release.outputs.apk_name }}
      apk_sha256: ${{ steps.release.outputs.apk_sha256 }}
      version_code: ${{ steps.release.outputs.version_code }}
      version_name: ${{ steps.release.outputs.version_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify signed release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_release.py verify-tag --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and verification tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Install Android-compatible test shell
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mksh
      - name: Make Gradle wrapper executable
        run: |
          printf '%s\n' '497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          chmod +x ./gradlew
      - name: Restore release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p .local
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .local/txtoi-release.keystore
          cat > signing.properties <<EOF
          storeFile=.local/txtoi-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Test release tooling
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Build and lint
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :app:verifyReleaseModernXposedMetadata --dependency-verification=strict --no-daemon
          else
            ./gradlew :app:lintDebug :app:testDebugUnitTest :app:verifyModernXposedMetadata --dependency-verification=strict --no-daemon
          fi
      - name: Test with Android mksh semantics
        run: ./gradlew :app:testDebugUnitTest -ProotProtocolTestShell=/bin/mksh --dependency-verification=strict --no-daemon
      - name: Verify release entry points after shrinking
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_r8_entrypoints.py --apk app/build/outputs/apk/release/app-release.apk --mapping app/build/outputs/mapping/release/mapping.txt --dexdump "$ANDROID_HOME/build-tools/36.0.0/dexdump"
      - name: Verify release APK identity
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          apk_name="txtoi-${GITHUB_REF_NAME}.apk"
          apk="app/build/outputs/apk/release/$apk_name"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          python3 .github/scripts/verify_release_apk.py --apk "$apk" --metadata app/build/outputs/apk/release/output-metadata.json --tag "$GITHUB_REF_NAME" --build-tools "$ANDROID_HOME/build-tools/36.0.0" --source-root "$GITHUB_WORKSPACE" --r8-candidate true --github-output "$GITHUB_OUTPUT"
      - name: Upload verified release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: txtoi-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/txtoi-${{ github.ref_name }}.apk
          if-no-files-found: error
      - name: Remove signing files
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f signing.properties .local/txtoi-release.keystore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: txtoi-release-${{ github.ref_name }}
          path: release-apk
      - name: Stage, verify and publish both repositories
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          MIRROR_REPOSITORY: Xposed-Modules-Repo/io.github.selectionmenucontrol
          APK_NAME: ${{ needs.verify.outputs.apk_name }}
          APK_SHA256: ${{ needs.verify.outputs.apk_sha256 }}
          VERSION_CODE: ${{ needs.verify.outputs.version_code }}
          VERSION_NAME: ${{ needs.verify.outputs.version_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish_release.py publish --repo "$GITHUB_REPOSITORY" --mirror-repo "$MIRROR_REPOSITORY" --tag "$GITHUB_REF_NAME" --mirror-tag "$VERSION_CODE-$VERSION_NAME" --commit "$GITHUB_SHA" --version "$VERSION_NAME" --apk "release-apk/$APK_NAME" --sha256 "$APK_SHA256" --notes .github/release-notes.md
