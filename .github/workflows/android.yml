name: Android CI

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify signed release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          test "$(jq -r .object.type <<< "$tag_ref")" = tag
          tag_object=$(jq -r .object.sha <<< "$tag_ref")
          tag_data=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}")
          jq -e --arg sha "$GITHUB_SHA" '.verification.verified == true and .object.type == "commit" and .object.sha == $sha and (.verification.signature | startswith("-----BEGIN SSH SIGNATURE-----"))' <<< "$tag_data" >/dev/null
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Restore release signing configuration
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p .local
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .local/txtoi-release.keystore
          cat > signing.properties <<EOF
          storeFile=.local/txtoi-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build and lint
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew :app:assembleRelease :app:lintRelease :app:testDebugUnitTest :app:verifyModernXposedMetadata :app:verifyReleaseModernXposedMetadata --no-daemon
          else
            ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:verifyModernXposedMetadata --no-daemon
          fi
      - name: Name release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/txtoi-${{ github.ref_name }}.apk
      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: txtoi-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/txtoi-${{ github.ref_name }}.apk
          if-no-files-found: error
      - name: Prepare LSPosed mirror release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/release/output-metadata.json
          version_code=$(jq -er '.elements[0].versionCode' "$metadata")
          version_name=$(jq -er '.elements[0].versionName' "$metadata")
          test "$version_code" -gt 0
          test -n "$version_name"
          test "$GITHUB_REF_NAME" = "v$version_name"
          echo "LSPOSED_TAG=$version_code-$version_name" >> "$GITHUB_ENV"
          echo "LSPOSED_VERSION=$version_name" >> "$GITHUB_ENV"
          echo "LSPOSED_ASSET=app/build/outputs/apk/release/txtoi-${GITHUB_REF_NAME}.apk" >> "$GITHUB_ENV"
      - name: Verify signed LSPosed mirror tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          MIRROR_REPOSITORY: Xposed-Modules-Repo/io.github.selectionmenucontrol
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?XPOSED_REPO_TOKEN is required for LSPosed release sync}"
          tag_ref=$(gh api "repos/${MIRROR_REPOSITORY}/git/ref/tags/${LSPOSED_TAG}")
          test "$(jq -r .object.type <<< "$tag_ref")" = tag
          tag_object=$(jq -r .object.sha <<< "$tag_ref")
          tag_data=$(gh api "repos/${MIRROR_REPOSITORY}/git/tags/${tag_object}")
          jq -e --arg sha "$GITHUB_SHA" '.verification.verified == true and .object.type == "commit" and .object.sha == $sha and (.verification.signature | startswith("-----BEGIN SSH SIGNATURE-----"))' <<< "$tag_data" >/dev/null
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/txtoi-${{ github.ref_name }}.apk
          body: |
            ## 改进

            - 新增拖动排序，移动后自动保存，支持恢复默认排序。[#2](https://github.com/TheKingBucket001/txtoi/issues/2)
            - 扩展项动态枚举，固定位置依据当前 ColorOS 菜单策略识别；仍只需 system 作用域。
            - 固定项置顶，固定、隐藏和检测不可用的选项不能拖动。
            - 列表与整卡拖动范围受限，标题和底部恢复按钮固定。
            - 修复连续勾选失效、长按高亮残留及取消拖动误保存；保存成功后短暂提示“已保存”。
            - 关于页支持小窗口滚动，无法打开网页时给出提示。

            ## 使用范围

            已在 ColorOS 16 / Android 16 验证。剪切、复制、粘贴、全选、分享等宿主内置动作不属于统一扩展清单；系统接口变化或应用自定义菜单仍可能需要适配。
      - name: Sync release to LSPosed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          MIRROR_REPOSITORY: Xposed-Modules-Repo/io.github.selectionmenucontrol
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?XPOSED_REPO_TOKEN is required for LSPosed release sync}"
          release_notes="$RUNNER_TEMP/lsposed-release-notes.md"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$release_notes"
          if gh release view "$LSPOSED_TAG" --repo "$MIRROR_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$LSPOSED_TAG" --repo "$MIRROR_REPOSITORY" --title "$LSPOSED_VERSION" --notes-file "$release_notes"
            gh release upload "$LSPOSED_TAG" "$LSPOSED_ASSET" --repo "$MIRROR_REPOSITORY" --clobber
          else
            gh release create "$LSPOSED_TAG" "$LSPOSED_ASSET" --verify-tag --repo "$MIRROR_REPOSITORY" --title "$LSPOSED_VERSION" --notes-file "$release_notes"
          fi
          asset_name=$(basename "$LSPOSED_ASSET")
          expected_digest="sha256:$(sha256sum "$LSPOSED_ASSET" | awk '{print $1}')"
          mirror_digest=$(gh release view "$LSPOSED_TAG" --repo "$MIRROR_REPOSITORY" --json assets --jq ".assets[] | select(.name == \"$asset_name\") | .digest")
          test "$mirror_digest" = "$expected_digest"
